<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系统概况 · 抽出的布局</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--font-size-body);
      color: var(--color-text);
      background: var(--color-background);
    }
    .sider {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--size-sider);
      background: var(--color-surface);
      box-shadow: var(--shadow-sider);
      padding: 16px 12px;
    }
    .brand { display: flex; gap: 8px; align-items: center; height: 32px; margin-bottom: 16px; font-weight: 700; }
    .mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--color-brand); color: #fff;
      display: grid; place-items: center; font-size: 13px;
    }
    .menu { display: flex; flex-direction: column; gap: 4px; }
    .menu a {
      height: var(--size-menu-item);
      border-radius: var(--radius-menu);
      padding: 0 16px;
      display: flex; align-items: center;
      color: var(--color-text);
      text-decoration: none;
    }
    .menu a.on { background: var(--color-primary); color: var(--color-on-primary); }
    .main { margin-left: var(--size-sider); min-height: 100vh; }
    .top {
      height: var(--size-header);
      background: var(--color-surface);
      box-shadow: var(--shadow-header);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--space-header-x);
    }
    .crumb { color: var(--color-text-secondary); }
    .crumb b { color: var(--color-text); font-weight: 500; }
    .page { padding: 16px var(--space-page) 32px; display: flex; flex-direction: column; gap: 16px; }
    .shell, .panel {
      background: var(--color-surface);
      border-radius: var(--radius-shell);
      box-shadow: var(--shadow-header);
    }
    .shell { padding: 16px 24px 20px; }
    .shell h1 { margin: 0; font-size: 20px; }
    .shell h1 span { margin-left: 8px; font-size: 14px; font-weight: 400; color: var(--color-text-secondary); }
    .hello { margin: 18px 0 0; font-size: var(--font-size-hero); font-weight: var(--font-weight-hero); }
    .sub { margin: 4px 0 0; color: var(--color-text-secondary); }
    .grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .card {
      background: var(--color-background);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      min-height: 96px;
    }
    .card strong { display: block; font-size: 28px; line-height: 1.2; margin-top: 6px; }
    .card small { color: var(--color-text-secondary); }
    .panel { padding: 16px 20px 8px; }
    .panel h2 { margin: 0 0 12px; font-size: var(--font-size-section); font-weight: var(--font-weight-section); }
    .row { display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; align-items: center; margin-bottom: 14px; }
    .track { height: var(--size-bar); border-radius: var(--radius-pill); background: #f0f0f0; overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; }
    .fill.product { width: 100%; background: repeating-linear-gradient(-45deg, var(--color-bar-product) 0 6px, #ff8a45 6px 12px); }
    .fill.floor { width: 100%; background: repeating-linear-gradient(-45deg, var(--color-bar-floor) 0 6px, #6c9bff 6px 12px); }
    .fill.banner { width: 100%; background: repeating-linear-gradient(-45deg, var(--color-bar-banner) 0 6px, #a78bfa 6px 12px); }
    .fill.news { width: 100%; background: repeating-linear-gradient(-45deg, var(--color-bar-news) 0 6px, #45d392 6px 12px); }
    .tabs { display: flex; gap: 20px; padding: 4px 4px 0; }
    .tabs span { padding-bottom: 8px; color: var(--color-text-secondary); }
    .tabs span.on { color: var(--color-primary); border-bottom: 2px solid var(--color-primary); }
  </style>
</head>
<body>
  <aside class="sider">
    <div class="brand"><span class="mark">站</span> 官网CMS</div>
    <nav class="menu">
      <a class="on" href="#dash">系统概况</a>
      <a href="#dash">内容管理</a>
      <a href="#dash">联系询盘</a>
      <a href="#dash">合规举报</a>
      <a href="#dash">后台管理</a>
    </nav>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb">管理后台 / <b>系统概况</b></div>
      <div>admin</div>
    </header>
    <div class="page">
      <section class="shell">
        <h1>系统概况 <span>内容健康与待办总览</span></h1>
        <p class="hello">早上好，admin</p>
        <p class="sub">内容管理工作台</p>
        <div class="grid">
          <article class="card"><small>分类内容</small><strong>14 · 10 · 11</strong></article>
          <article class="card"><small>新闻</small><strong>75</strong><small>已发布 75/75</small></article>
          <article class="card"><small>静态文章</small><strong>2</strong></article>
          <article class="card"><small>媒体文件</small><strong>634</strong></article>
          <article class="card"><small>门店</small><strong>144</strong></article>
          <article class="card"><small>联系询盘</small><strong>0</strong></article>
          <article class="card"><small>合规举报</small><strong>0</strong></article>
        </div>
      </section>
      <section class="panel">
        <h2>启用对比</h2>
        <div class="row"><span>产品启用</span><div class="track"><div class="fill product"></div></div><b>107/107</b></div>
        <div class="row"><span>楼层启用</span><div class="track"><div class="fill floor"></div></div><b>80/80</b></div>
        <div class="row"><span>Banner 启用</span><div class="track"><div class="fill banner"></div></div><b>24/24</b></div>
        <div class="row"><span>新闻发布</span><div class="track"><div class="fill news"></div></div><b>75/75</b></div>
        <div class="tabs"><span class="on">活动</span><span>快捷入口</span><span>待办</span></div>
      </section>
    </div>
  </div>
</body>
</html>
