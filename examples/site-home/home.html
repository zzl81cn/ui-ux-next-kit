<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>官网首页 · 抽出的布局</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-background);
    }
    a { color: inherit; text-decoration: none; }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--size-header-height);
      display: flex;
      align-items: center;
      background: var(--color-background);
      border-bottom: 1px solid var(--color-header-border);
      box-shadow: var(--shadow-header);
    }
    .bar {
      width: min(var(--size-content), calc(100% - 48px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: var(--size-logo-width);
      height: var(--size-logo-height);
      display: grid;
      place-items: center start;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .nav { display: flex; gap: 4px; margin-left: 12px; }
    .nav a {
      padding: var(--space-nav-y) var(--space-nav-x);
      border-radius: var(--radius-nav);
      font-size: var(--font-size-nav);
      line-height: var(--line-height-nav);
      letter-spacing: -0.15px;
    }
    .nav a:hover { color: var(--color-primary); }
    .banner {
      height: var(--size-banner-height);
      background:
        radial-gradient(ellipse at 50% 80%, rgba(0, 220, 210, 0.45), transparent 55%),
        linear-gradient(180deg, #042433 0%, #06384a 55%, #021820 100%);
      color: #fff;
      display: grid;
      place-items: center;
      position: relative;
    }
    .banner h2 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: 0.04em; }
    .banner p { margin: 8px 0 0; opacity: 0.85; }
    .dots {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 8px;
    }
    .dots i {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.55);
      display: block;
    }
    .dots i.on { width: 22px; background: #fff; }
    .floor {
      background: var(--color-floor);
      padding: var(--space-floor-top) 0 var(--space-floor-bottom);
      display: flex;
      flex-direction: column;
      gap: var(--space-grid);
    }
    .wrap { width: min(var(--size-content), calc(100% - 32px)); margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: var(--size-card) var(--size-card);
      gap: var(--space-grid);
    }
    .card {
      background: var(--color-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      min-height: 420px;
      padding: var(--space-card-top) var(--space-card-x) var(--space-card-bottom);
      text-align: center;
      transition: transform var(--duration-hover), box-shadow var(--duration-hover);
    }
    .card.hero { min-height: var(--size-hero-card-height); }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-card-hover);
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-title);
      line-height: var(--line-height-title);
    }
    .card .spec {
      margin: 0 0 8px;
      font-size: var(--font-size-body);
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
    .price { margin: 0 0 12px; color: var(--color-primary); line-height: 1; }
    .price b { font-size: var(--font-size-title); }
    .price span { font-size: var(--font-size-price-symbol); }
    .shot {
      height: 180px;
      margin: 12px auto 0;
      border-radius: 12px;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.55), transparent 40%),
        linear-gradient(180deg, #d7dde6, #eef1f4);
    }
    .card.hero .shot { height: 240px; max-width: 480px; }
    .buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      height: var(--size-button-height);
      padding: 0 28px;
      border-radius: var(--radius-pill);
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-size: var(--font-size-body);
    }
    .buy:hover { background: var(--color-primary-hover); }
    .footer {
      background: var(--color-footer);
      color: var(--color-on-footer);
      padding: 56px 0 36px;
    }
    .footer .wrap { display: flex; justify-content: space-between; gap: 24px; }
    .footer h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    .footer a, .footer p { display: block; margin: 0 0 8px; font-size: 13px; opacity: 0.82; }
    @media (max-width: 1200px) {
      .grid { grid-template-columns: 1fr; }
      .nav { display: none; }
      .banner { height: min(360px, 60vw); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="bar">
      <a class="logo" href="#top">站点</a>
      <nav class="nav" aria-label="主导航">
        <a href="#floor">边缘计算</a>
        <a href="#floor">笔记本电脑</a>
        <a href="#floor">台式机</a>
        <a href="#floor">显示器</a>
        <a href="#floor">智能设备</a>
        <a href="#floor">周边选件</a>
      </nav>
    </div>
  </header>

  <section class="banner" aria-label="首页 Banner">
    <div>
      <h2>新品</h2>
      <p>示例产品 · 标准版</p>
    </div>
    <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>
  </section>

  <section class="floor" id="floor">
    <article class="card hero wrap">
      <h3>示例产品 A</h3>
      <p class="spec">Intel Core5 205H · 16GB · 512GB · RTX 3050 · 16 寸</p>
      <p class="price"><span>¥</span><b>5999</b></p>
      <a class="buy" href="#buy">立即购买</a>
      <div class="shot" role="img" aria-label="产品示意"></div>
    </article>
    <div class="grid wrap">
      <article class="card">
        <h3>示例产品 B</h3>
        <p class="spec">Intel Core5 315 · 12GB · 512GB · 蓝色</p>
        <p class="price"><span>¥</span><b>4499</b></p>
        <a class="buy" href="#buy">立即购买</a>
        <div class="shot" role="img" aria-label="产品示意"></div>
      </article>
      <article class="card">
        <h3>示例产品 C</h3>
        <p class="spec">Ryzen 9 8940HX · RTX 5060 · 16 寸 2.5K</p>
        <p class="price"><span>¥</span><b>9999</b></p>
        <a class="buy" href="#buy">立即购买</a>
        <div class="shot" role="img" aria-label="产品示意"></div>
      </article>
    </div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div>
        <h4>选购产品</h4>
        <a href="#floor">笔记本电脑</a>
        <a href="#floor">台式机</a>
        <a href="#floor">显示器</a>
      </div>
      <div>
        <h4>客服热线</h4>
        <a href="tel:4000000000">400-000-0000</a>
        <p>服务时间：9:00-18:00</p>
      </div>
    </div>
  </footer>
</body>
</html>
